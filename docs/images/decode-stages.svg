<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The decode, stage by stage: header parsing on the CPU, then byte unstuffing, Huffman synchronisation passes, the write pass, DC prediction, IDCT, upsampling and colour conversion on the GPU">
<title>The decode, stage by stage: header parsing on the CPU, then byte unstuffing, Huffman synchronisation passes, the write pass, DC prediction, IDCT, upsampling and colour conversion on the GPU</title>
<rect width="960" height="200" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a877f"/></marker></defs>
<text x="40" y="32" font-size="17" fill="#1d1d1b" text-anchor="start" font-weight="700">exact-gpu-jpeg's decode, stage by stage</text>
<rect x="40" y="56" width="112" height="56" rx="8" fill="#f3f2ee" stroke="#8a877f" stroke-width="1.5"/>
<text x="96.0" y="80.2" font-size="12.5" fill="#1d1d1b" text-anchor="middle" font-weight="600">Header parsing</text>
<text x="96.0" y="96.2" font-size="11" fill="#5f5d58" text-anchor="middle" font-weight="normal">in Python, strict</text>
<rect x="168" y="56" width="112" height="56" rx="8" fill="#d6e4f6" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="224.0" y="80.2" font-size="12.5" fill="#1d1d1b" text-anchor="middle" font-weight="600">Byte unstuffing</text>
<text x="224.0" y="96.2" font-size="11" fill="#5f5d58" text-anchor="middle" font-weight="normal">0xFF 0x00 → 0xFF</text>
<path d="M153,84.0 H166" fill="none" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="296" y="56" width="112" height="56" rx="8" fill="#d6e4f6" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="352.0" y="80.2" font-size="12.5" fill="#1d1d1b" text-anchor="middle" font-weight="600">Huffman sync</text>
<text x="352.0" y="96.2" font-size="11" fill="#5f5d58" text-anchor="middle" font-weight="normal">passes (Section 2.1)</text>
<path d="M281,84.0 H294" fill="none" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="424" y="56" width="112" height="56" rx="8" fill="#d6e4f6" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="480.0" y="80.2" font-size="12.5" fill="#1d1d1b" text-anchor="middle" font-weight="600">Write pass</text>
<text x="480.0" y="96.2" font-size="11" fill="#5f5d58" text-anchor="middle" font-weight="normal">coefficients per block</text>
<path d="M409,84.0 H422" fill="none" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="552" y="56" width="112" height="56" rx="8" fill="#d6e4f6" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="608.0" y="80.2" font-size="12.5" fill="#1d1d1b" text-anchor="middle" font-weight="600">DC prediction</text>
<text x="608.0" y="96.2" font-size="11" fill="#5f5d58" text-anchor="middle" font-weight="normal">by prefix sums</text>
<path d="M537,84.0 H550" fill="none" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="680" y="56" width="112" height="56" rx="8" fill="#d6e4f6" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="736.0" y="80.2" font-size="12.5" fill="#1d1d1b" text-anchor="middle" font-weight="600">IDCT</text>
<text x="736.0" y="96.2" font-size="11" fill="#5f5d58" text-anchor="middle" font-weight="normal">accurate integer</text>
<path d="M665,84.0 H678" fill="none" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="808" y="56" width="112" height="56" rx="8" fill="#d6e4f6" stroke="#1a5fb4" stroke-width="1.5"/>
<text x="864.0" y="80.2" font-size="12.5" fill="#1d1d1b" text-anchor="middle" font-weight="600">Upsampling and</text>
<text x="864.0" y="96.2" font-size="11" fill="#5f5d58" text-anchor="middle" font-weight="normal">colour conversion</text>
<path d="M793,84.0 H806" fill="none" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M40,122 V128 H152 V122" fill="none" stroke="#5f5d58" stroke-width="1.4"/>
<text x="96.0" y="145" font-size="12" fill="#5f5d58" text-anchor="middle" font-weight="normal">on the CPU (host)</text>
<path d="M168,122 V128 H920 V122" fill="none" stroke="#1a5fb4" stroke-width="1.4"/>
<text x="544.0" y="145" font-size="12" fill="#1a5fb4" text-anchor="middle" font-weight="normal">on the GPU</text>
<path d="M296,160 V166 H536 V160" fill="none" stroke="#1a5fb4" stroke-width="1.4"/>
<text x="416.0" y="183" font-size="12" fill="#1a5fb4" text-anchor="middle" font-weight="normal">parallel Huffman decoding (Section 2.1)</text>
<path d="M680,160 V166 H920 V160" fill="none" stroke="#1a5fb4" stroke-width="1.4"/>
<text x="800.0" y="183" font-size="12" fill="#1a5fb4" text-anchor="middle" font-weight="normal">libjpeg-turbo's integer arithmetic (Section 2.2)</text>
</svg>
