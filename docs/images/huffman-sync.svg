<text x="40" y="592" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">Each piece between checkpoints starts from a known-true state, so all pieces run at once (8 or 16 threads per chunk) and write the 8×8 blocks' coefficients.</text>
<text x="40" y="616" font-size="12" fill="#1d1d1b" text-anchor="start" font-weight="normal">Camera photos settle in 2 passes. A file not settled after 3 passes is redone with up to 5 more; then it is declined to the CPU decoder.</text>
<text x="40" y="633" font-size="12" fill="#1d1d1b" text-anchor="start" font-weight="normal">Restart markers, where a file has them, cut the stream into independent segments. An error bit (a code not in the table, data ending early) declines the file.</text>
</svg>
