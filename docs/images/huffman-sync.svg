<text x="40" y="464" font-size="11.5" fill="#1a5fb4" text-anchor="start" font-weight="normal">arrows: one chunk's exit state becomes the next chunk's entry</text>
<text x="920" y="464" font-size="11.5" fill="#1d1d1b" text-anchor="end" font-weight="normal">chunk 2 decodes again from its true entry and stops at its first checkpoint</text>
<text x="40" y="486" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">Within a CUDA block of 128 chunks this repeats in shared memory until nothing changes; global passes, launched three at a time, carry exits across blocks.</text>
<text x="40" y="503" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">A re-decode stops at the first checkpoint whose state matches the one recorded before: from there on its decode is identical, so most re-decodes are short.</text>
<text x="40" y="536" font-size="13" fill="#1d1d1b" text-anchor="start" font-weight="600">4  When no exit changes, every entry is true. A prefix sum numbers the blocks, and the write pass decodes every piece in its own thread.</text>
