<text x="463" y="320" font-size="11.5" fill="#c64600" text-anchor="start" font-weight="normal">falls into step with the true code boundaries, typically within tens to a few hundred bits</text>
<text x="40" y="338" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">Light blue: each chunk runs just past its own end, into the next chunk, to the first code boundary there. That crossing is on purpose:</text>
<text x="40" y="355" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">the state at that boundary is the chunk's exit, which the next chunk checks against. It also records how many 8×8 blocks it finished, and its checkpoint states (7 or 15).</text>
<text x="40" y="384" font-size="13" fill="#1d1d1b" text-anchor="start" font-weight="600">3  Next passes: each chunk compares its entry with the previous chunk's exit and, if they differ, decodes again from that exit.</text>
