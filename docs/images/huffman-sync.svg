<text x="920" y="188" font-size="11.5" fill="#5f5d58" text-anchor="end" font-weight="normal">grey ticks: where the true codes begin (unknown to a chunk that starts mid-stream)</text>
<text x="40" y="232" font-size="13" fill="#1d1d1b" text-anchor="start" font-weight="600">2  First pass: every chunk decodes from its own first bit with a guessed state, to the first code boundary past its end.</text>
