<svg xmlns="http://www.w3.org/2000/svg" width="960" height="646" viewBox="0 0 960 646" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Parallel Huffman decoding by self-synchronisation: chunks decoded from guessed states fall into step with the true code boundaries; passes repeat until each chunk's entry matches its neighbour's exit; a write pass then decodes every checkpoint piece in parallel">
<title>Parallel Huffman decoding by self-synchronisation: chunks decoded from guessed states fall into step with the true code boundaries; passes repeat until each chunk's entry matches its neighbour's exit; a write pass then decodes every checkpoint piece in parallel</title>
<rect width="960" height="646" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a877f"/></marker></defs>
<text x="40" y="32" font-size="17" fill="#1d1d1b" text-anchor="start" font-weight="700">Parallel Huffman decoding in exact-gpu-jpeg, by self-synchronisation</text>
<text x="40" y="54" font-size="12.5" fill="#5f5d58" text-anchor="start" font-weight="normal">The method of Weißenberger and Schmidt (ICPP 2018), as this library uses it. Drawn with 5 chunks and 3 checkpoints each; real files have thousands of chunks.</text>
<path d="M40,78 q9,-9 18,0" fill="none" stroke="#1a5fb4" stroke-width="2"/>
<text x="64" y="82" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">decoded from a true code boundary</text>
<path d="M290,78 q9,-9 18,0" fill="none" stroke="#c64600" stroke-width="2" stroke-dasharray="4 3"/>
<text x="314" y="82" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">decoded from a wrong start (a guess)</text>
<path d="M560,72 l5,5 l-5,5 l-5,-5 z" fill="#1d1d1b"/>
<text x="572" y="82" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">checkpoint (state recorded)</text>
<path d="M750,78 q9,-12 18,0" fill="none" stroke="#62a0ea" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="774" y="82" font-size="12" fill="#5f5d58" text-anchor="start" font-weight="normal">past the chunk's end</text>
<text x="40" y="112" font-size="13" fill="#1d1d1b" text-anchor="start" font-weight="600">1  The compressed stream (after byte unstuffing) is cut into chunks, one GPU thread each: 1,024, 2,048 or 8,192 bits, by the file's size.</text>
